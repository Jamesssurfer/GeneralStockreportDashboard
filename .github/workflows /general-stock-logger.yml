name: General Stock Report Logger Pipeline

on:
  repository_dispatch:
    types: [general_stock_update]
  workflow_dispatch:
    inputs:
      raw_text:
        description: 'Paste the raw report text (one or more === -delimited stories)'
        required: true
  schedule:
    # Runs every 6 hours purely to re-age active/archive items.
    # Does NOT create new entries.
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  log-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Debug Info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "Has client_payload: ${{ github.event.client_payload != null }}"
          echo "Has manual raw_text: ${{ github.event.inputs.raw_text != '' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workspace contents:"
          ls -la
          echo "Python version:"
          python --version
          echo "Checking if scripts/logger.py exists:"
          if [ -f "scripts/logger.py" ]; then
            echo "✅ scripts/logger.py found"
          else
            echo "❌ scripts/logger.py NOT found"
            echo "Looking for logger.py:"
            find . -name "logger.py" -type f
          fi
          echo "Checking if scripts/parser.py exists:"
          if [ -f "scripts/parser.py" ]; then
            echo "✅ scripts/parser.py found"
          else
            echo "❌ scripts/parser.py NOT found"
            echo "Looking for parser.py:"
            find . -name "parser.py" -type f
          fi

      - name: Run Logger Script
        env:
          REBUCKET_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          DISPATCH_CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_RAW_TEXT: ${{ github.event.inputs.raw_text }}
        run: |
          echo "Running logger script..."
          echo "REBUCKET_ONLY=$REBUCKET_ONLY"
          echo "Has DISPATCH_CLIENT_PAYLOAD=$([ -n "$DISPATCH_CLIENT_PAYLOAD" ] && echo "yes" || echo "no")"
          echo "Has MANUAL_RAW_TEXT=$([ -n "$MANUAL_RAW_TEXT" ] && echo "yes" || echo "no")"
          python scripts/logger.py
          exit_code=$?
          echo "Logger script exit code: $exit_code"
          if [ $exit_code -ne 0 ]; then
            echo "::warning::Logger script exited with code $exit_code (partial failure possible)"
          fi

      - name: Commit Data Update
        if: always()
        run: |
          echo "Checking for data changes..."
          git status
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            echo "Changes detected, committing..."
            git commit -m "🤖 System: Updated General Stock Report data [skip ci]"
            git push origin main
            echo "Changes committed and pushed"
          fi
